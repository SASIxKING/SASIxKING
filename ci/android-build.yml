name: Build APK

on:
  push:
    branches: [ "arena/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug + release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/voltbill.jks \
            -alias voltbill \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass voltbill -keypass voltbill \
            -dname "CN=VoltBill Pro, OU=Sales, O=VoltBill, L=Puducherry, S=Puducherry, C=IN"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        env:
          VOLTBILL_KEYSTORE: keystore/voltbill.jks
          VOLTBILL_STORE_PASSWORD: voltbill
          VOLTBILL_KEY_ALIAS: voltbill
          VOLTBILL_KEY_PASSWORD: voltbill
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VoltBillPro-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/VoltBillPro-release.apk 2>/dev/null \
            || cp app/build/outputs/apk/release/app-release-unsigned.apk dist/VoltBillPro-release-unsigned.apk
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltBillPro-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
