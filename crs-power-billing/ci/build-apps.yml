name: Build CRS Power Billing (Android APK + Windows EXE)

# NOTE: this file lives in ci/ because the automation account that created the
# branch is not permitted to write to .github/workflows/. Move it to
# .github/workflows/build-apps.yml (or run ./build-apps.sh --ci) to enable it.

on:
  push:
    branches: ["arena/**", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (GST + inventory rules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crs-power-billing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crs-power-billing/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crs-power-billing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crs-power-billing/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build offline bundle and sync Android
        run: npm run android:sync

      - name: Verify the bundle is self-contained
        run: |
          # The APK loads these assets from the WebView with no server, so an
          # accidental web build would show a blank screen on the phone.
          grep -q 'src="./assets/' android/app/src/main/assets/public/index.html \
            || { echo "::error::APK assets have absolute paths - wrong build target"; exit 1; }
          grep -rq 'Insufficient stock' android/app/src/main/assets/public/assets/*.js \
            || { echo "::error::offline business core missing from APK assets"; exit 1; }
          ! grep -rq 'fetch(`/api' android/app/src/main/assets/public/assets/*.js \
            || { echo "::error::APK still contains HTTP API calls"; exit 1; }
          echo "APK payload verified: offline-ready"

      - name: Generate signing keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/crs-release.jks \
            -alias crspower \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass crspower -keypass crspower \
            -dname "CN=C.R.S Power Solution, OU=Sales, O=CRS Power, L=Pondicherry, S=Puducherry, C=IN"

      - name: Assemble APKs
        working-directory: crs-power-billing/android
        env:
          CRS_KEYSTORE: ${{ github.workspace }}/crs-power-billing/keystore/crs-release.jks
          CRS_STORE_PASSWORD: crspower
          CRS_KEY_ALIAS: crspower
          CRS_KEY_PASSWORD: crspower
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/ \;
          ls -lh dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: CRS-Power-Billing-Android
          path: crs-power-billing/dist-apk/*.apk
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crs-power-billing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crs-power-billing/package-lock.json

      # Electron's postinstall downloads its binary, so scripts must run here.
      - name: Install dependencies
        run: npm ci

      - name: Build offline bundle
        run: npm run build:windows

      - name: Verify the bundle is self-contained
        shell: bash
        run: |
          # A web bundle inside the desktop app would show a blank window,
          # so fail the build here rather than shipping it.
          grep -q 'src="./assets/' dist/index.html \
            || { echo "::error::dist/index.html has absolute asset paths - wrong build target"; exit 1; }
          grep -rq 'Insufficient stock' dist/assets/*.js \
            || { echo "::error::offline business core missing from bundle"; exit 1; }
          echo "Bundle verified: relative paths + offline core present"

      - name: Package installer and portable exe
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: CRS-Power-Billing-Windows
          path: |
            crs-power-billing/release/*.exe
            crs-power-billing/release/*.blockmap
          if-no-files-found: error
          retention-days: 90
